# A push to `mine` deploys Pages CMS to the VPS with Kamal. Secrets: Settings > Secrets and variables > Actions.
name: deploy

on:
  push:
    branches: [mine]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # CI's own token pushes the image, and the server pulls with it during the deploy.
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CRYPTO_KEY: ${{ secrets.CRYPTO_KEY }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_APP_NAME: ${{ secrets.GH_APP_NAME }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
      GITHUB_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
      GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install kamal -v "~> 2.12" --no-document
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: docker/setup-buildx-action@v3
      # `setup` is `deploy` plus installing Docker where missing; safe on a server that already runs kamal-proxy.
      - name: Deploy
        run: kamal setup
